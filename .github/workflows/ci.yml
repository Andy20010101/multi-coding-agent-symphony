name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_mutation_gate:
        description: Run the mutation gate even when no relevant changed files are detected
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      run_real_codex:
        description: Run the gated real Codex Harness smoke
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: "20"

      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: git diff --check
      - run: pnpm mcas doctor

      - name: Detect mutation gate scope
        id: mutation_scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
          RUN_MUTATION_GATE: ${{ inputs.run_mutation_gate || 'false' }}
        run: |
          set -euo pipefail

          if [[ "$RUN_MUTATION_GATE" == "true" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$(jq -r '.pull_request.base.sha // ""' "$GITHUB_EVENT_PATH")"
            head="$(jq -r '.pull_request.head.sha // ""' "$GITHUB_EVENT_PATH")"
          elif [[ "$EVENT_NAME" == "push" ]]; then
            base="$(jq -r '.before // ""' "$GITHUB_EVENT_PATH")"
            head="$HEAD_SHA"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ -z "$base" || -z "$head" || "$base" =~ ^0+$ ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git cat-file -e "$base^{commit}" || ! git cat-file -e "$head^{commit}"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git diff --name-only "$base" "$head" > "$RUNNER_TEMP/mutation-changed-files.txt"

          if grep -Eq '^(src/|tests/|fixtures/|package\.json$|pnpm-lock\.yaml$|\.github/workflows/ci\.yml$)' "$RUNNER_TEMP/mutation-changed-files.txt"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - run: pnpm test:mutation:gate
        if: ${{ steps.mutation_scope.outputs.run == 'true' }}

      - name: Optional real CLI preflight
        if: ${{ vars.MCAS_RUN_REAL_CODEX == '1' || inputs.run_real_codex == 'true' }}
        env:
          MCAS_RUN_REAL_CODEX: "1"
        run: pnpm mcas doctor --real-cli --adapter codex --require-gates --proof-dir tmp/real-cli-proofs

      - name: Optional real Codex Harness smoke
        if: ${{ vars.MCAS_RUN_REAL_CODEX == '1' || inputs.run_real_codex == 'true' }}
        env:
          MCAS_RUN_REAL_CODEX: "1"
          MCAS_REAL_CLI_PROOF_DIR: tmp/real-cli-proofs
        run: pnpm smoke:harness:codex:real
