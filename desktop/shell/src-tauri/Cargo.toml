[package]
name = "symphony-desktop-shell"
version = "0.1.0"
description = "Tauri host boundary for the Symphony Desktop Shell MVP"
edition = "2021"
publish = false

[lib]
name = "symphony_desktop_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
